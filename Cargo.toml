[package]
name = "want"
version = "0.1.5"
edition = "2024"
description = "Wolfram|Alpha Network Tool: an AI-native CLI, MCP server and agent skill"
license = "MIT"
repository = "https://github.com/Iorest/want"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
home = "0.5.12"
jiff = "0.2.38"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
rmcp = { version = "3.6", features = ["server", "transport-io"] }
rustyline = "19.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = true
strip = true

[dev-dependencies]
serde_yaml_ng = "0.10.0"
